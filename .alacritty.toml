[env]
TERM = "xterm-256color"

[window]
# decorations = "None"
# startup_mode = "Maximized"
decorations_theme_variant = "Dark"
resize_increments = true
option_as_alt = "Both"
[window.dimensions]
columns = 80
lines = 25

[scrolling]
history = 100000

[font]
size = 16
builtin_box_drawing = false
[font.normal]
family = "Ubuntu Mono"

[cursor]
blink_timeout = 0
[cursor.style]
blinking = "Never"

[terminal]
osc52 = "OnlyCopy"

[mouse]
hide_when_typing = true

[hints]
enabled = []

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
mode = "~Vi|~Search"
action = "ClearHistory"
