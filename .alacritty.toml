[env]
TERM = "xterm-256color"

[window]
# decorations = "None"
# startup_mode = "Maximized"
decorations_theme_variant = "Dark"
resize_increments = true
option_as_alt = "Both"
[window.dimensions]
columns = 80
lines = 25

[scrolling]
history = 100000

[font]
size = 16
builtin_box_drawing = false
[font.normal]
family = "Ubuntu Mono"

# [colors.primary]
# foreground = "#aaaaaa"
# background = "#000000"
# [colors.cursor]
# cursor = "#555555"
# [colors.selection]
# text = "#000000"
# background = "#484848"
# [colors.normal]
# black = "#484f58"
# red = "#ff7b72"
# green = "#3fb950"
# yellow = "#d29922"
# blue = "#58a6ff"
# magenta = "#bc8cff"
# cyan = "#39c5cf"
# white = "#b1bac4"
# [colors.bright]
# black = "#6e7681"
# red = "#ffa198"
# green = "#56d364"
# yellow = "#e3b341"
# blue = "#79c0ff"
# magenta = "#d2a8ff"
# cyan = "#56d4dd"
# white = "#ffffff"

[cursor]
blink_timeout = 0
[cursor.style]
blinking = "Never"

[terminal]
osc52 = "Disabled"

[mouse]
hide_when_typing = true

[hints]
enabled = []

[[keyboard.bindings]]
key = "L"
mods = "Control|Shift"
mode = "~Vi|~Search"
action = "ClearHistory"
