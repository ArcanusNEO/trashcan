[global]
  bind interfaces only = no
  hosts allow = 127.0.0.0/8 192.168.0.0/23 10.48.59.0/24
  hosts deny = all

  netbios name = XEON
  workgroup = WORKGROUP
  server string = %h (Samba %v)
  server role = standalone server
  security = user
  passdb backend = tdbsam
  map to guest = never
  restrict anonymous = 2

  server min protocol = smb2
  client min protocol = smb2
  server signing = mandatory

  logging = file
  log file = /var/log/samba/log.%m
  max log size = 2000
  log level = 1

  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  unix extensions = no
  deadtime = 727

[homes]
  comment = Home Directories
  browseable = no
  read only = no
  valid users = %S
  create mask = 0644
  directory mask = 0755