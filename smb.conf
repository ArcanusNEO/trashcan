[global]
  workgroup = WORKGROUP
  server string = %h file server
  netbios name = THINKPAD

  security = user
  passdb backend = tdbsam
  map to guest = bad user

  server min protocol = SMB2
  client min protocol = SMB2
  server signing = mandatory

  interfaces = 10.48.59.0/24 lo
  bind interfaces only = yes

  log file = /var/log/samba/log.%m
  max log size = 2000
  log level = 1

  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  unix extensions = no
  deadtime = 727

[homes]
  browseable = no
  writable = yes
  valid users = %S
  create mask = 0644
  directory mask = 0755